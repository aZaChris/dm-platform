  <script>
    (function () {
      const D = 4;
      const tl = gsap.timeline({ paused: true });
      // Segni runici: tratti geometrici attorno al cerchio (niente font esterni).
      const g = document.getElementById('ac-runes');
      for (let i = 0; i < 24; i++) {
        const a = (i / 24) * Math.PI * 2, x = 500 + Math.cos(a) * 460, y = 500 + Math.sin(a) * 460;
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', i % 3 === 0 ? 'M-8 -10 L0 10 L8 -10' : i % 3 === 1 ? 'M-6 -10 V10 M-6 0 L6 -10' : 'M0 -10 V10 M-7 -3 H7');
        p.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ') rotate(' + ((a * 180) / Math.PI + 90).toFixed(1) + ')');
        p.setAttribute('class', 'ac-draw'); g.appendChild(p);
      }
      // Entrata: l'oro dello zoom precedente si dissolve e scopre il portale.
      tl.fromTo('#ac-in', { opacity: 1 }, { opacity: 0, duration: 0.4, ease: 'power2.out' }, 0);
      tl.fromTo('.ac-draw', { strokeDasharray: 3200, strokeDashoffset: 3200 }, { strokeDashoffset: 0, duration: 1.1, ease: 'power2.out', stagger: 0.01 }, 0.1);
      tl.fromTo('#ac-outer', { rotation: 0 }, { rotation: 40, duration: D, ease: 'none' }, 0);
      tl.fromTo('#ac-inner', { rotation: 0 }, { rotation: -60, duration: D, ease: 'none' }, 0);
      tl.fromTo('#ac-card', { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'expo.out' }, 0.35);
      // Email e password si scrivono una lettera alla volta.
      tl.fromTo('#ac-email', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.9, ease: 'steps(13)' }, 1.0);
      tl.fromTo('#ac-pass', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.5, ease: 'steps(8)' }, 2.0);
      tl.fromTo('#ac-cursor', { x: 1300, y: 1000 }, { x: 960, y: 770, duration: 0.6, ease: 'power3.out' }, 2.2);
      tl.to('#ac-cursor', { scale: 0.85, duration: 0.08 }, 2.85);
      tl.to('#ac-cursor', { scale: 1, duration: 0.12 }, 2.93);
      // Clic su «Entra»: le rune si accendono e la porta di luce si apre dal pulsante.
      tl.to('#ac-outer', { stroke: '#fff2cf', duration: 0.2 }, 2.9);
      tl.fromTo('#ac-light', { clipPath: 'circle(0px at 960px 762px)' }, { clipPath: 'circle(2300px at 960px 762px)', duration: 0.8, ease: 'power3.in', immediateRender: false }, 3.0);
      window.__timelines['accedi'] = tl;
    })();
