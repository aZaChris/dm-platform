  <script>
    (function () {
      const D = 8;
      const tl = gsap.timeline({ paused: true });
      function rng(s) { return function () { s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const r = rng(23);
      // Braci dalle due torce.
      const host = document.getElementById('ld-embers');
      [150, 1770].forEach(function (cx) {
        for (let i = 0; i < 12; i++) {
          const e = document.createElement('i'); e.className = 'ld-ember'; host.appendChild(e);
          const d = 1.5 + r() * 1.3, start = r() * d, n = Math.max(1, Math.floor((D - start) / d)), x = cx - 10 + r() * 20;
          tl.fromTo(e, { x: x, y: 680, opacity: 0, scale: 0.5 + r() }, { keyframes: { opacity: [0, 1, 0.7, 0] }, x: x + (r() - 0.5) * 160, y: 680 - 300 - r() * 260, duration: d, ease: 'none', repeat: n - 1 }, start);
        }
      });
      ['#ld-t1', '#ld-t2'].forEach(function (t, i) {
        tl.fromTo(t, { scaleY: 1, rotation: -3 }, { scaleY: 1.15, rotation: 3, duration: 0.18 + i * 0.03, ease: 'sine.inOut', yoyo: true, repeat: Math.max(0, Math.floor(D / (0.18 + i * 0.03)) - 1) }, 0);
      });
      // Parallasse e nebbia: il mondo dietro si muove, i titoli atterrati restano fermi.
      tl.fromTo('#ld-back', { x: 0, y: 0 }, { x: -120, y: -260, duration: D, ease: 'none' }, 0);
      tl.fromTo('#ld-fogs', { x: 0, y: 0 }, { x: 160, y: -340, duration: D, ease: 'none' }, 0);
      tl.fromTo('#ld-fog1', { xPercent: 0 }, { xPercent: 18, duration: D, ease: 'sine.inOut' }, 0);
      tl.fromTo('#ld-fog2', { xPercent: 0 }, { xPercent: -14, duration: D, ease: 'sine.inOut' }, 0);
      tl.fromTo('#ld-rooms', { strokeDasharray: 9000, strokeDashoffset: 9000 }, { strokeDashoffset: 0, duration: 3.2, ease: 'power2.out' }, 0);
      // Entrata: il mondo arriva dal bagliore del clic precedente.
      tl.fromTo('#ld-page', { scale: 1.06, filter: 'blur(10px)' }, { scale: 1, filter: 'blur(0px)', duration: 0.6, ease: 'expo.out' }, 0);
      tl.fromTo('#ld-navline', { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: 'expo.out' }, 0.2);
      tl.fromTo('#ld-pill', { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power2.out' }, 0.3);
      // Titolo forgiato: ogni lettera nasce oro incandescente e si raffredda in avorio, un frame dopo l'altra.
      const title = document.getElementById('ld-title');
      ['Tavolo virtuale', 'per giochi di ruolo'].forEach(function (line, li) {
        if (li) title.appendChild(document.createElement('br'));
        line.split('').forEach(function (ch) { const s = document.createElement('span'); s.className = 'l'; s.textContent = ch === ' ' ? ' ' : ch; title.appendChild(s); });
      });
      tl.fromTo('#ld-title .l', { opacity: 0, scale: 1.5, color: '#fff2c8', textShadow: '0 0 28px rgba(255,190,90,.95)' },
        { opacity: 1, scale: 1, duration: 0.35, ease: 'expo.out', stagger: 0.033 }, 0.45);
      tl.to('#ld-title .l', { color: '#ece6d6', textShadow: '0 0 0px rgba(255,190,90,0)', duration: 0.6, ease: 'power2.out', stagger: 0.033 }, 0.85);
      const sub = document.getElementById('ld-sub');
      'Il DM carica la mappa e crea i token, i giocatori entrano con un invito e muovono i loro.'.split(' ').forEach(function (w) { const s = document.createElement('span'); s.className = 'w'; s.textContent = w; sub.appendChild(s); });
      tl.fromTo('#ld-sub .w', { opacity: 0, color: '#4a5a60' }, { opacity: 1, color: '#c9cfca', duration: 0.2, ease: 'power2.out', stagger: 0.05 }, 1.7);
      tl.fromTo('#ld-cta', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: 'back.out(1.4)' }, 2.3);
      tl.fromTo('.ld-shine', { x: -120 }, { x: 520, duration: 0.9, ease: 'power2.inOut', stagger: 0.2 }, 2.6);
      // Scorrimento verso le funzioni: la pagina sale, la nav resta.
      tl.to('#ld-page', { y: -1080, duration: 0.8, ease: 'power2.inOut' }, 3.2);
      tl.to(['#ld-nav', '#ld-navline'], { y: 1080, duration: 0.8, ease: 'power2.inOut' }, 3.2);
      tl.fromTo('#ld-fhead', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.2, ease: 'power2.out' }, 3.8);
      // Le funzioni si srotolano una alla volta, come pergamene, e si arrotolano per lasciare il posto.
      ['#ld-s1', '#ld-s2', '#ld-s3'].forEach(function (s, i) {
        const t0 = 3.9 + i * 1.12;
        tl.fromTo(s + ' .ld-paper', { scaleY: 0.02 }, { scaleY: 1, duration: 0.45, ease: 'power3.out' }, t0);
        tl.fromTo(s + ' .bot', { y: 0 }, { y: 452, duration: 0.45, ease: 'power3.out' }, t0);
        tl.fromTo(s + ' .top', { opacity: 0 }, { opacity: 1, duration: 0.1 }, t0);
        tl.fromTo(s + ' .bot', { opacity: 0 }, { opacity: 1, duration: 0.1 }, t0);
        tl.fromTo(s + ' .ld-draw', { strokeDasharray: 400, strokeDashoffset: 400 }, { strokeDashoffset: 0, duration: 0.6, ease: 'power2.out' }, t0 + 0.2);
        if (i < 2) {
          tl.to(s + ' .ld-paper', { scaleY: 0.02, duration: 0.25, ease: 'power3.in' }, t0 + 0.95);
          tl.to(s + ' .bot', { y: 0, duration: 0.25, ease: 'power3.in' }, t0 + 0.95);
          tl.to(s, { opacity: 0, duration: 0.08 }, t0 + 1.18);
        }
      });
      // Il cursore clicca «Crea il tuo tavolo» nella nav: lo zoom attraverso il pulsante apre la scena dopo.
      tl.fromTo('#ld-cursor', { x: 1900, y: 900 }, { x: 1700, y: 92, duration: 0.6, ease: 'power3.out' }, 6.6);
      tl.to('#ld-cursor', { scale: 0.85, duration: 0.08 }, 7.25);
      tl.to('#ld-cursor', { scale: 1, duration: 0.12 }, 7.33);
      tl.fromTo('#ld-zoom', { opacity: 0 }, { opacity: 1, duration: 0.05, immediateRender: false }, 7.3);
      tl.fromTo('#ld-zoom', { clipPath: 'inset(46px 96px 1000px 1488px round 12px)' }, { clipPath: 'inset(0px 0px 0px 0px round 0px)', duration: 0.5, ease: 'power3.in', immediateRender: false }, 7.35);
      window.__timelines['landing'] = tl;
    })();
