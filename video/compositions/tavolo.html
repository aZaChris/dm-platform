  <script>
    (function () {
      const D = 12, C = 70, MX = 96, MY = 150;
      const tl = gsap.timeline({ paused: true });
      function rng(s) { return function () { s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const r = rng(77);
      // Mappa a celle con l'alfabeto dell'app: . vuoto, f pavimento, w muro, d porta, a acqua (colori di lib/cells.ts).
      const COL = { f: '#6d6248', w: '#1a2226', d: '#a8743a', a: '#2f6f8f' };
      const MAP = [
        'wwwwwwwww.......', 'wfffffffw..aaa..', 'wfffffffw.aaaaa.', 'wffffffffdaaaaa.', 'wfffffffw.aaaa..', 'wwwwdwwww.......',
        '....f.....wwwwww', '....ffffffdffffw', '....f.....wffffw', 'wwwwdwww..wffffw', 'wffffffw..wffffw', 'wwwwwwww..wwwwww'];
      const cells = document.getElementById('tv-cells'), painted = [];
      MAP.forEach(function (row, y) { row.split('').forEach(function (k, x) {
        if (k === '.') return;
        const c = document.createElement('i'); c.className = 'tv-cell'; c.style.left = x * C + 'px'; c.style.top = y * C + 'px'; c.style.background = COL[k];
        if (k === 'w') c.style.boxShadow = 'inset 0 -6px 0 rgba(0,0,0,.35)';
        cells.appendChild(c); painted.push(c);
      }); });
      const at = function (col, row) { return { x: col * C, y: row * C }; };
      // 0: la pagina a quadretti del libro diventa la mappa.
      tl.fromTo('#tv-parch', { opacity: 1 }, { opacity: 0, duration: 0.6, ease: 'power2.inOut' }, 0);
      tl.fromTo('#tv-world', { scale: 1.15 }, { scale: 1, duration: 0.9, ease: 'expo.out' }, 0);
      tl.fromTo(painted, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: 'back.out(2)', stagger: 0.008 }, 0.4);
      tl.fromTo('#tv-fogs', { x: 0 }, { x: 220, duration: D, ease: 'none' }, 0);
      // I token atterrano.
      [['#tv-a', 3, 2], ['#tv-t', 5, 3], ['#tv-c', 13, 8]].forEach(function (k, i) {
        const p = at(k[1], k[2]);
        tl.fromTo(k[0], { x: p.x, y: p.y - 160, scale: 1.6, opacity: 0 }, { x: p.x, y: p.y, scale: 1, opacity: 1, duration: 0.45, ease: 'back.out(1.8)' }, 1.6 + i * 0.12);
      });
      tl.fromTo(['#tv-tabs', '#tv-panel', '#tv-dice'], { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.5, ease: 'expo.out', stagger: 0.1 }, 0.6);
      tl.fromTo('#tv-tools', { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.5);
      // Pannello a schede come nell'app: la scheda attiva segue il verbo.
      const tabs = gsap.utils.toArray('#tv-tabs .tv-tab'), panes = { 0: '#tv-p-scena', 1: '#tv-p-chat', 2: '#tv-p-init' };
      function scheda(i, t) {
        tl.set(tabs, { color: '#8a9ba0', backgroundColor: 'rgba(0,0,0,0)', boxShadow: 'inset 0 -3px 0 rgba(0,0,0,0)' }, t);
        tl.set(tabs[i], { color: '#dcb468', backgroundColor: '#183038', boxShadow: 'inset 0 -3px 0 #dcb468' }, t);
        Object.keys(panes).forEach(function (k) { tl.to(panes[k], { opacity: Number(k) === i ? 1 : 0, duration: 0.2, ease: 'power2.out' }, t); });
      }
      scheda(0, 0.7); scheda(1, 2.6); scheda(0, 5.2); scheda(1, 7.6); scheda(2, 9.5);
      // Mentre Aria si muove, la sua riga in «Scena» si accende e la posizione si aggiorna.
      tl.to('#tv-sa', { boxShadow: 'inset 0 0 0 2px #dcb468', duration: 0.2 }, 5.6);
      tl.to('#tv-pos1', { opacity: 0, duration: 0.15 }, 7.1);
      tl.to('#tv-pos2', { opacity: 1, duration: 0.15 }, 7.1);
      // Ordine d'iniziativa di partenza: mescolato.
      const slot = function (i) { return 70 + i * 82; };
      gsap.set('#tv-rc', { y: slot(0) }); gsap.set('#tv-ra', { y: slot(1) }); gsap.set('#tv-rt', { y: slot(2) });
      // Ogni verbo: titolo per sfocatura, poi esce quando arriva il successivo.
      const verbs = [['#tv-v1', 2.6], ['#tv-v2', 5.2], ['#tv-v3', 7.6], ['#tv-v4', 9.5]];
      verbs.forEach(function (v, i) {
        tl.fromTo(v[0], { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.2, ease: 'power2.out' }, v[1]);
        if (i < 3) tl.to(v[0], { opacity: 0, filter: 'blur(8px)', duration: 0.15 }, verbs[i + 1][1] - 0.18);
      });
      // TIRA: clic su «Tira d20», il dado vola nella chat e diventa il tiro.
      tl.fromTo('#tv-cursor', { x: 1900, y: 1100 }, { x: 1560, y: 950, duration: 0.6, ease: 'power3.out' }, 2.7);
      tl.to('#tv-cursor', { scale: 0.85, duration: 0.08 }, 3.35); tl.to('#tv-cursor', { scale: 1, duration: 0.12 }, 3.43);
      tl.fromTo('#tv-d20', { x: 1482, y: 860, opacity: 0, rotation: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.15, immediateRender: false }, 3.4);
      tl.to('#tv-d20', { keyframes: { x: [1482, 1150, 1380], y: [860, 520, 400] }, rotation: 900, duration: 0.8, ease: 'power2.inOut' }, 3.45);
      tl.to('#tv-d20', { scale: 0.3, opacity: 0, duration: 0.2, ease: 'power2.in' }, 4.25);
      tl.fromTo('#tv-roll', { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(1.6)', immediateRender: false }, 4.3);
      const sh = document.getElementById('tv-sparks');
      for (let i = 0; i < 18; i++) {
        const s = document.createElement('i'); s.className = 'tv-spark'; sh.appendChild(s);
        const a = r() * Math.PI * 2, d = 60 + r() * 120;
        tl.fromTo(s, { x: 1700, y: 450, opacity: 1 }, { x: 1700 + Math.cos(a) * d, y: 450 + Math.sin(a) * d, opacity: 0, duration: 0.7, ease: 'expo.out', immediateRender: false }, 4.35);
      }
      // MUOVI: il cursore prende Aria e la porta fino alla porta; le celle si accendono sotto la scia.
      const path = [[3, 2], [3, 3], [4, 3], [5, 3], [6, 3], [7, 3], [8, 3], [9, 3]];
      const trails = document.getElementById('tv-trails');
      const a0 = at(3, 2);
      tl.to('#tv-cursor', { x: MX + a0.x + 40, y: MY + a0.y + 40, duration: 0.45, ease: 'power3.inOut' }, 5.0);
      path.forEach(function (p, i) {
        if (!i) return;
        const q = at(p[0], p[1]), t0 = 5.7 + (i - 1) * 0.2;
        tl.to('#tv-a', { x: q.x, y: q.y, duration: 0.18, ease: 'power2.inOut' }, t0);
        tl.to('#tv-cursor', { x: MX + q.x + 40, y: MY + q.y + 40, duration: 0.18, ease: 'power2.inOut' }, t0);
        const tr = document.createElement('i'); tr.className = 'tv-trail'; tr.style.left = q.x + 'px'; tr.style.top = q.y + 'px'; trails.appendChild(tr);
        tl.fromTo(tr, { opacity: 0 }, { keyframes: { opacity: [0, 0.9, 0.2] }, duration: 0.9, ease: 'none', immediateRender: false }, t0);
      });
      tl.to('#tv-cursor', { opacity: 0, duration: 0.2 }, 7.3);
      // SUSSURRA: il messaggio privato arriva nel fumo menta.
      const sm = document.getElementById('tv-smokes');
      for (let i = 0; i < 7; i++) {
        const s = document.createElement('i'); s.className = 'tv-smoke'; sm.appendChild(s);
        tl.fromTo(s, { x: 1300 + r() * 420, y: 560 + r() * 60, scale: 0.4, opacity: 0 }, { keyframes: { opacity: [0, 0.9, 0] }, scale: 1.8, y: '-=90', duration: 1.4, ease: 'power1.out', immediateRender: false }, 7.75 + i * 0.05);
      }
      tl.fromTo('#tv-whisper', { opacity: 0, filter: 'blur(10px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.6, ease: 'power2.out', immediateRender: false }, 7.95);
      // INIZIATIVA: le righe si girano come carte e si mettono in ordine 18 · 15 · 12; l'anello menta va su Aria.
      tl.to(['#tv-rc', '#tv-ra', '#tv-rt'], { rotationX: 90, duration: 0.15, ease: 'power2.in', stagger: 0.05 }, 9.8);
      tl.to('#tv-ra', { y: slot(0), duration: 0.01 }, 10.1);
      tl.to('#tv-rt', { y: slot(1), duration: 0.01 }, 10.1);
      tl.to('#tv-rc', { y: slot(2), duration: 0.01 }, 10.1);
      tl.to(['#tv-ra', '#tv-rt', '#tv-rc'], { rotationX: 0, duration: 0.3, ease: 'back.out(1.6)', stagger: 0.07 }, 10.12);
      tl.fromTo('#tv-ra', { boxShadow: 'inset 0 0 0 0px #8fd3b8' }, { boxShadow: 'inset 0 0 0 3px #8fd3b8', duration: 0.3, immediateRender: false }, 10.5);
      tl.fromTo('#tv-round', { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, 10.55);
      tl.fromTo('#tv-ring', { opacity: 0, scale: 1.4, rotation: 0 }, { opacity: 1, scale: 1, rotation: 90, duration: 0.5, ease: 'expo.out', immediateRender: false }, 10.55);
      tl.to('#tv-ring', { rotation: 160, duration: 0.85, ease: 'none' }, 11.05);
      // Frustata verso la pagina dei membri.
      tl.to('#tv-world', { x: -1500, filter: 'blur(18px)', duration: 0.3, ease: 'power3.in' }, 11.68);
      window.__timelines['tavolo'] = tl;
    })();
